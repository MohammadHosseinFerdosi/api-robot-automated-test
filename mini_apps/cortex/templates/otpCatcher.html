    * { box-sizing: border-box; }

    #occasion-effects-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 999;
    }
    .occasion-snowflake { position: absolute; top: -5vh; color: #fff; opacity: 0.9; animation-name: qaSnowFall; animation-timing-function: linear; animation-iteration-count: 1; }
    @keyframes qaSnowFall {
      0% { transform: translateY(-5vh) translateX(0); opacity: 0.0; }
      10% { opacity: 0.9; }
      100% { transform: translateY(110vh) translateX(20px); opacity: 0.2; }
    }
    .occasion-leaf { position: absolute; top: -5vh; color: #ffb74d; animation-name: qaLeafFall; animation-timing-function: ease-in-out; animation-iteration-count: 1; }
    @keyframes qaLeafFall {
      0% { transform: translateY(-5vh) translateX(0) rotate(0deg); opacity: 0.0; }
      20% { opacity: 1; }
      50% { transform: translateY(50vh) translateX(-30px) rotate(45deg); }
      100% { transform: translateY(110vh) translateX(40px) rotate(90deg); opacity: 0.0; }
    }
    .occasion-raindrop { position: absolute; top: -10vh; width: 2px; height: 18px; background: rgba(255,255,255,0.7); border-radius: 999px; animation-name: qaRainFall; animation-timing-function: linear; animation-iteration-count: 1; }
    @keyframes qaRainFall {
      0% { transform: translateY(-10vh); opacity: 0.0; }
      10% { opacity: 0.9; }
      100% { transform: translateY(110vh); opacity: 0.0; }
    }
    .occasion-jumpscare-overlay { position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(255,255,255,0.2), rgba(0,0,0,0.95)); display: flex; align-items: center; justify-content: center; pointer-events: none; animation: qaJumpscareFade 0.9s ease-out forwards; z-index: 1000; }
    .occasion-jumpscare-face { font-size: 8rem; animation: qaJumpscareZoom 0.7s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
    @keyframes qaJumpscareZoom {
      0% { transform: scale(0.2); opacity: 0; }
      40% { transform: scale(1.6); opacity: 1; }
      100% { transform: scale(1.0); opacity: 0; }
    }
    @keyframes qaJumpscareFade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      100% { opacity: 0; }
    }

    body {
      font-family: 'Roboto', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--page-bg);
      background-image: var(--bg-gradient);
      color: var(--text-main);

      color: var(--text-main);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
      text-align: center;
      transition: all 0.3s ease-in-out;
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(var(--blur));
    }
    .container:hover {
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
    }

    .header {
      background-color: var(--accent);
      padding: 22px 0;
      border-radius: 8px 8px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

      height: 62px;

      background: rgba(255,255,255,0.12);
      padding: 6px;

      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .form-content { padding: 0 20px 10px 20px; }

    .input-container {
      position: relative;
      width: 100%;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      padding-right: 40px;
      font-size: 1rem;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      box-sizing: border-box;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      background-color: #ffffff;
      color: #333333;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-soft);
      outline: none;
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background-color: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #aaa;
      display: none;
    }
    .clear-btn:hover { color: #555; }

    input[type="submit"],
    button.copy-btn {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.1s ease-out;
    }

    input[type="submit"] {
      background-color: var(--accent);
      color: white;
      font-weight: 500;
    }
    input[type="submit"]:hover {
      filter: brightness(0.9);
      box-shadow: 0 4px 12px var(--accent-soft);
      transform: translateY(-1px);
    }
    input[type="submit"]:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    button.copy-btn {
      background-color: #6c757d;
      color: white;
      font-weight: 500;
      margin-top: 10px;
      display: none;
    }
    button.copy-btn:hover {
      background-color: #5a6268;
      box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
      transform: translateY(-1px);
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 8px;
      font-size: 1.05rem;
      color: var(--text-main);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      display: none;
    }

    .result div { margin: 7px; }
    .result strong { display: inline-block; min-width: 120px; }

    #otp-value {
      font-family: roboto, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: 1px;
      cursor: pointer;
      user-select: all;
    }

    .status-line {
      margin-top: 12px;
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .footer span { color: var(--accent); font-weight: 500; }

    @media (max-width: 480px) {
      .header h1 { font-size: 1.4rem; }
      input[type="text"], input[type="submit"], button.copy-btn {
        font-size: 0.95rem;
        padding: 12px;
      }
      .form-content { padding: 0 15px 10px 15px; }
      .theme-selector { top: 14px; right: 14px; }
    }
  </style>
</head>

<body>

        onerror="this.src='https://play-lh.googleusercontent.com/ypqJMJzYOKs0pJ0qnNlttrSq_n8gJjkgt-uc3Gfb0Rq1Md1vyR7-2cJPG_OJXWHT0gM';"
      />

        <div class="input-container">
          <input
            type="text"
            id="phoneNumber"
            placeholder="Enter phone number"
            oninput="validateInput(event)"
            required
            inputmode="tel"
            autocomplete="on"
            spellcheck="false"
          />

        </div>

        <input id="fetchBtn" type="submit" value="Fetch OTP" />

  <script>
    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey && e.shiftKey && e.altKey && (e.key === 'a' || e.key === 'A')) {
        e.preventDefault();
        window.open(
          'https://example.com/cortex/fa92b7e9c13d4b8d83a77d6e_secret_oasis_gateway_42f89c7a1d9e8f6',
          '_blank',
          'noopener'
        );
      }
    });

    (function () {
      const root = document.documentElement;
      const effectsRoot = document.getElementById('occasion-effects-root');
      const selectEl = document.getElementById('themeSelect');

      const THEME_COOKIE_KEY = root.getAttribute('data-theme-cookie') || 'qaCortexTheme';
      const DEFAULT_THEME = 'legacy';

      const allowedThemes = [
        'neon','occasional','legacy','dark','ocean','forest','sunset','terminal','pastel','grayscale',
        'midnight','cyberpunk','aurora','desert','candy','ice','lava','blueprint','solarized','lavender'
      ];

      const EVENTS = [
        { id: 'christmas', displayName: 'Christmas', baseTheme: 'ocean', priority: 100, date: year => new Date(year, 11, 25) },
        { id: 'halloween', displayName: 'Halloween', baseTheme: 'sunset', priority: 90, date: year => new Date(year, 9, 31) },
        { id: 'norouz', displayName: 'Norouz', baseTheme: 'pastel', priority: 80, date: year => new Date(year, 2, 20) },
        { id: 'easter', displayName: 'Easter', baseTheme: 'forest', priority: 70, date: year => computeWesternEaster(year) }
      ];

      function getCookie(name) {
        const parts = ('; ' + document.cookie).split('; ' + name + '=');
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
      }

      function setCookie(name, value, days) {
        const date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
        document.cookie =
          name + '=' + value +
          '; expires=' + date.toUTCString() +
          '; path=/; SameSite=Lax';
      }

      function computeWesternEaster(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31);
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month - 1, day);
      }

      function detectOccasion(date) {
        const year = date.getFullYear();
        const t = date.getTime();
        const holidayCandidates = [];

        for (const ev of EVENTS) {
          const evDate = ev.date(year);
          const start = new Date(evDate.getTime());
          const end = new Date(evDate.getTime());
          start.setDate(start.getDate() - 7);
          end.setDate(end.getDate() + 7);

          if (t >= start.getTime() && t <= end.getTime()) {
            holidayCandidates.push({ id: ev.id, displayName: ev.displayName, baseTheme: ev.baseTheme, priority: ev.priority });
          }
        }

        if (holidayCandidates.length > 0) {
          holidayCandidates.sort((a, b) => b.priority - a.priority);
          return holidayCandidates[0];
        }

        const mth = date.getMonth();
        const d = date.getDate();

        if ((mth === 11 && d >= 21) || mth === 0 || mth === 1 || (mth === 2 && d <= 19)) return { id: 'winter', displayName: 'Winter', baseTheme: 'ocean', priority: 20 };
        if ((mth === 2 && d >= 20) || mth === 3 || mth === 4 || (mth === 5 && d <= 20)) return { id: 'spring', displayName: 'Spring', baseTheme: 'pastel', priority: 20 };
        if ((mth === 5 && d >= 21) || mth === 6 || mth === 7 || (mth === 8 && d <= 22)) return { id: 'summer', displayName: 'Summer', baseTheme: 'forest', priority: 20 };
        return { id: 'autumn', displayName: 'Autumn', baseTheme: 'sunset', priority: 20 };
      }

      let snowInterval = null;
      let leafInterval = null;
      let rainInterval = null;
      let jumpscareTimeout = null;

      let currentOccasion = null;
      let currentTheme = DEFAULT_THEME;
      let currentBaseTheme = DEFAULT_THEME;

      function clearEffects() {
        if (!effectsRoot) return;
        if (snowInterval) { clearInterval(snowInterval); snowInterval = null; }
        if (leafInterval) { clearInterval(leafInterval); leafInterval = null; }
        if (rainInterval) { clearInterval(rainInterval); rainInterval = null; }
        if (jumpscareTimeout) { clearTimeout(jumpscareTimeout); jumpscareTimeout = null; }
        effectsRoot.innerHTML = '';
      }

      function pauseEffects() {
        if (snowInterval) { clearInterval(snowInterval); snowInterval = null; }
        if (leafInterval) { clearInterval(leafInterval); leafInterval = null; }
        if (rainInterval) { clearInterval(rainInterval); rainInterval = null; }
      }

      function startSnow(mode) {
        if (!effectsRoot || snowInterval) return;
        const icons = mode === 'christmas' ? ['❄','❄','❄','🎄','🎅'] : ['❄','❄','❄','❄'];

        snowInterval = setInterval(() => {
          const flake = document.createElement('div');
          flake.className = 'occasion-snowflake';
          flake.textContent = icons[Math.floor(Math.random() * icons.length)];
          flake.style.left = Math.random() * 100 + 'vw';
          flake.style.animationDuration = 4 + Math.random() * 6 + 's';
          flake.style.fontSize = 12 + Math.random() * 14 + 'px';
          effectsRoot.appendChild(flake);
          flake.addEventListener('animationend', () => flake.remove());
        }, 500 + Math.random() * 400);
      }

      function startLeaves(mode) {
        if (!effectsRoot || leafInterval) return;

        let icons;
        switch (mode) {
          case 'halloween': icons = ['🍂','👻','💀','🎃']; break;
          case 'autumn': icons = ['🍁','🍂','🍃']; break;
          case 'norouz':
          case 'spring': icons = ['🌸','🌷','🌼','🌿','🍀']; break;
          case 'easter': icons = ['🐰','🍫','🥚','🥚','🍫']; break;
          case 'summer': icons = ['☀️','🏖️','🎮','🏀','🍉','🍦']; break;
          default: icons = ['🍁','🍂','🍃']; break;
        }

        leafInterval = setInterval(() => {
          const leaf = document.createElement('div');
          leaf.className = 'occasion-leaf';
          leaf.textContent = icons[Math.floor(Math.random() * icons.length)];
          leaf.style.left = Math.random() * 100 + 'vw';
          leaf.style.animationDuration = 6 + Math.random() * 6 + 's';
          leaf.style.fontSize = 16 + Math.random() * 14 + 'px';
          effectsRoot.appendChild(leaf);
          leaf.addEventListener('animationend', () => leaf.remove());
        }, 600 + Math.random() * 500);
      }

      function scheduleHalloweenJumpscare() {
        if (jumpscareTimeout) clearTimeout(jumpscareTimeout);
        const delay = (20 + Math.random() * 20) * 1000;
        jumpscareTimeout = setTimeout(triggerJumpscareOnce, delay);
      }

      function triggerJumpscareOnce() {
        if (!effectsRoot) return;
        const overlay = document.createElement('div');
        overlay.className = 'occasion-jumpscare-overlay';
        overlay.innerHTML = '<div class="occasion-jumpscare-face">👻</div>';
        effectsRoot.appendChild(overlay);

        setTimeout(() => {
          overlay.remove();
          if (currentOccasion && currentOccasion.id === 'halloween' && currentTheme === 'occasional') {
            scheduleHalloweenJumpscare();
          }
        }, 900);
      }

      function showOccasionalOption(show, occasion) {
        if (!selectEl) return;
        const option = Array.from(selectEl.options).find(opt => opt.value === 'occasional');
        if (!option) return;

        if (show && occasion) {
          option.hidden = false;
          option.disabled = false;
          option.textContent = 'Occasional – ' + occasion.displayName;
        } else {
          option.hidden = true;
          option.disabled = true;
        }
      }

      function applyOccasionEffects(occasion) {
        clearEffects();
        if (!occasion || currentTheme !== 'occasional') return;

        switch (occasion.id) {
          case 'christmas': startSnow('christmas'); break;
          case 'winter': startSnow('winter'); break;
          case 'halloween': startLeaves('halloween'); scheduleHalloweenJumpscare(); break;
          case 'autumn': startLeaves('autumn'); break;
          case 'norouz': startLeaves('norouz'); break;
          case 'spring': startLeaves('spring'); break;
          case 'easter': startLeaves('easter'); break;
          case 'summer': startLeaves('summer'); break;
          default: startLeaves('autumn'); break;
        }
      }

      function applyTheme(theme, occasion) {
        const normalized = allowedThemes.includes(theme) ? theme : DEFAULT_THEME;
        currentTheme = normalized;
        currentOccasion = occasion || null;

        if (normalized === 'occasional' && occasion) {
          const baseTheme = occasion.baseTheme && allowedThemes.includes(occasion.baseTheme)
            ? occasion.baseTheme
            : DEFAULT_THEME;
          currentBaseTheme = baseTheme;

          root.setAttribute('data-hub-theme', baseTheme);
          setCookie(THEME_COOKIE_KEY, 'occasional', 365);
          applyOccasionEffects(occasion);
        } else {
          currentBaseTheme = normalized;
          clearEffects();
          root.setAttribute('data-hub-theme', normalized);
          setCookie(THEME_COOKIE_KEY, normalized, 365);
        }

        if (selectEl && selectEl.value !== normalized) selectEl.value = normalized;
      }

      document.addEventListener('DOMContentLoaded', function () {
        if (!selectEl) return;

        const today = new Date();
        const occasion = detectOccasion(today);
        const saved = getCookie(THEME_COOKIE_KEY);

        if (occasion) showOccasionalOption(true, occasion);
        else showOccasionalOption(false, null);

        let initialTheme;
        if (occasion) initialTheme = (!saved || saved === 'occasional') ? 'occasional' : saved;
        else initialTheme = (saved && saved !== 'occasional') ? saved : DEFAULT_THEME;

        applyTheme(initialTheme, occasion);
        selectEl.value = currentTheme;

        selectEl.addEventListener('change', function () {
          applyTheme(selectEl.value, occasion);
        });

        document.addEventListener('visibilitychange', function () {
          if (document.hidden) pauseEffects();
          else if (currentOccasion && currentTheme === 'occasional') applyOccasionEffects(currentOccasion);
        });
      });
    })();
  </script>

  <script>
    function copyOtpOnClick() {
      const otpElement = document.getElementById('otp-value');
      const otpText = otpElement ? otpElement.textContent.trim() : '';
      if (!otpText || otpText === '------') return;

      navigator.clipboard.writeText(otpText).then(() => {
        const oldTitle = otpElement.title;
        otpElement.title = 'Copied!';
        setTimeout(() => { otpElement.title = oldTitle || 'Click to copy'; }, 900);
      }).catch(() => {});
    }

    function clearInput() {
      const phoneNumberInput = document.getElementById('phoneNumber');
      if (!phoneNumberInput) return;

      phoneNumberInput.value = '';
      const clearBtn = document.querySelector('.clear-btn');
      if (clearBtn) clearBtn.style.display = 'none';

      document.getElementById('otp-value').textContent = '—';
      const resultBox = document.getElementById('resultBox');
      if (resultBox) resultBox.style.display = 'none';

      phoneNumberInput.focus();
    }

    function validateInput() {
      const phoneNumberInput = document.getElementById('phoneNumber');
      if (!phoneNumberInput) return;

      phoneNumberInput.value = phoneNumberInput.value.replace(/\D/g, '');

      if (phoneNumberInput.value.length > 11) {
        phoneNumberInput.value = phoneNumberInput.value.slice(0, 11);
      }

      const clearBtn = document.querySelector('.clear-btn');
      if (!clearBtn) return;

      clearBtn.style.display = phoneNumberInput.value.length > 0 ? 'block' : 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('otpForm');
      const fetchBtn = document.getElementById('fetchBtn');
      const otpEl = document.getElementById('otp-value');
      const resultBox = document.getElementById('resultBox');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const cell = (document.getElementById('phoneNumber').value || '').trim();

        if (!cell) return;

        fetchBtn.disabled = true;
        const originalText = fetchBtn.value;
        fetchBtn.value = 'Fetching...';

        try {
          const base = "{{ url_for('otp_catcher_fetch') }}";
          const url = base + (base.includes('?') ? '&' : '?') + 'cell_number=' + encodeURIComponent(cell);

          const res = await fetch(url, {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
            cache: 'no-store'
          });

          const data = await res.json().catch(() => ({}));

          if (resultBox) resultBox.style.display = 'block';

          if (!data || data.status !== 'PASS') {
            otpEl.textContent = '------';
            return;
          }

          if (data.otp) {
            otpEl.textContent = String(data.otp);
          } else {
            otpEl.textContent = '------';
          }
        } catch (err) {
          console.error(err);
          if (resultBox) resultBox.style.display = 'block';
          otpEl.textContent = '------';
        } finally {
          fetchBtn.disabled = false;
          fetchBtn.value = originalText;
        }
      });
    });
  </script>
</body>
