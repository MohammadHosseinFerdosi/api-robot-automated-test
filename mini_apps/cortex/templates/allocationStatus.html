    <!-- Apply theme from cookies (including 'occasional') as early as possible -->
    <script>
        (function () {
            function getCookie(name) {
                const cookieName = name + "=";
                const decodedCookie = decodeURIComponent(document.cookie || "");
                const cookieArray = decodedCookie.split(';');
                for (let i = 0; i < cookieArray.length; i++) {
                    let c = cookieArray[i].trim();
                    if (c.indexOf(cookieName) === 0) {
                        return c.substring(cookieName.length, c.length);
                    }
                }
                return "";
            }

            const allowedThemes = [
                'neon',
                'legacy',
                'dark',
                'ocean',
                'forest',
                'sunset',
                'terminal',
                'pastel',
                'grayscale',
                'midnight',
                'cyberpunk',
                'aurora',
                'desert',
                'candy',
                'ice',
                'lava',
                'blueprint',
                'solarized',
                'lavender',
                'occasional'
            ];

            function computeWesternEaster(year) {
                const a = year % 19;
                const b = Math.floor(year / 100);
                const c = year % 100;
                const d = Math.floor(b / 4);
                const e = b % 4;
                const f = Math.floor((b + 8) / 25);
                const g = Math.floor((b - f + 1) / 3);
                const h = (19 * a + b - d - g + 15) % 30;
                const i = Math.floor(c / 4);
                const k = c % 4;
                const l = (32 + 2 * e + 2 * i - h - k) % 7;
                const m = Math.floor((a + 11 * h + 22 * l) / 451);
                const month = Math.floor((h + l - 7 * m + 114) / 31); // 3 = March, 4 = April
                const day = ((h + l - 7 * m + 114) % 31) + 1;
                return new Date(year, month - 1, day);
            }

            const EVENTS = [
                {
                    id: 'christmas',
                    displayName: 'Christmas',
                    baseTheme: 'ocean',
                    priority: 100,
                    date: year => new Date(year, 11, 25)
                },
                {
                    id: 'halloween',
                    displayName: 'Halloween',
                    baseTheme: 'sunset',
                    priority: 90,
                    date: year => new Date(year, 9, 31)
                },
                {
                    id: 'norouz',
                    displayName: 'Norouz',
                    baseTheme: 'pastel',
                    priority: 80,
                    date: year => new Date(year, 2, 20)
                },
                {
                    id: 'easter',
                    displayName: 'Easter',
                    baseTheme: 'forest',
                    priority: 70,
                    date: year => computeWesternEaster(year)
                }
            ];

            function detectOccasion(date) {
                const year = date.getFullYear();
                const t = date.getTime();
                const holidayCandidates = [];

                // Holidays ±7 days
                for (const ev of EVENTS) {
                    const evDate = ev.date(year);
                    const start = new Date(evDate.getTime());
                    const end = new Date(evDate.getTime());
                    start.setDate(start.getDate() - 7);
                    end.setDate(end.getDate() + 7);

                    if (t >= start.getTime() && t <= end.getTime()) {
                        holidayCandidates.push({
                            id: ev.id,
                            displayName: ev.displayName,
                            baseTheme: ev.baseTheme,
                            priority: ev.priority
                        });
                    }
                }

                if (holidayCandidates.length > 0) {
                    holidayCandidates.sort((a, b) => b.priority - a.priority);
                    return holidayCandidates[0];
                }

                // Seasonal fallback
                const m = date.getMonth();
                const d = date.getDate();

                // Winter: Dec 21 – Mar 19
                if ((m === 11 && d >= 21) || m === 0 || m === 1 || (m === 2 && d <= 19)) {
                    return {
                        id: 'winter',
                        displayName: 'Winter',
                        baseTheme: 'ocean',
                        priority: 20
                    };
                }
                // Spring: Mar 20 – Jun 20
                if ((m === 2 && d >= 20) || m === 3 || m === 4 || (m === 5 && d <= 20)) {
                    return {
                        id: 'spring',
                        displayName: 'Spring',
                        baseTheme: 'pastel',
                        priority: 20
                    };
                }
                // Summer: Jun 21 – Sep 22
                if ((m === 5 && d >= 21) || m === 6 || m === 7 || (m === 8 && d <= 22)) {
                    return {
                        id: 'summer',
                        displayName: 'Summer',
                        baseTheme: 'forest',
                        priority: 20
                    };
                }
                // Autumn: Sep 23 – Dec 20
                return {
                    id: 'autumn',
                    displayName: 'Autumn',
                    baseTheme: 'sunset',
                    priority: 20
                };
            }

            // Resolve theme from cookies
            let theme =
                getCookie('qaCortexTheme') ||
                getCookie('qaHubTheme') ||
                getCookie('qaOtpTheme');

            const htmlEl = document.documentElement;
            let appliedTheme = 'neon';

            if (theme === 'occasional') {
                const occasion = detectOccasion(new Date());
                if (occasion && occasion.baseTheme && allowedThemes.includes(occasion.baseTheme)) {
                    appliedTheme = occasion.baseTheme;
                } else {
                    appliedTheme = 'neon';
                }
            } else {
                if (!allowedThemes.includes(theme)) {
                    appliedTheme = 'neon';
                } else {
                    appliedTheme = theme;
                }
            }

            htmlEl.setAttribute('data-theme', appliedTheme);
        })();
    </script>

<body>

    <div class="container">
        <!-- Loading / Status Icon -->
        <div class="icon">
            <svg id="loading-icon" viewBox="0 0 50 50">
                <circle cx="25" cy="25" r="20" stroke="var(--loading-color)" stroke-width="5" fill="none" stroke-dasharray="31.415, 31.415" />
            </svg>
            <!-- Checkmark -->
            <svg id="checkmark" viewBox="0 0 50 50">
                <path d="M18.9 35.7L7.5 24.3l2.1-2.1 9.3 9.3 19.3-19.3 2.1 2.1z" fill="var(--checkmark-color)" />
            </svg>
            <!-- Cross -->
            <svg id="cross" viewBox="0 0 50 50">
                <path d="M10 10L40 40M40 10L10 40" stroke="var(--cross-color)" stroke-width="5" stroke-linecap="round" />
            </svg>
        </div>

        <div class="message">Your Task Has Been Submitted. Please Wait for Its Results.</div>

        <h3>Submitted Data:</h3>
        <pre id="submitted-data"></pre>

        <h3>Execution Logs:</h3>
        <div class="log-container" id="log-console">[0] Waiting for updates...</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const requestData = {
            cellNumber: params.get("cellNumber"),
            nationalCode: params.get("nationalCode"),
            session_id: params.get("session_id")
        };

        document.getElementById("submitted-data").innerText = JSON.stringify(requestData, null, 2);

        let lastSeenLogs = [];
        let intervalId;
        let pollingInterval = 1000;
        let reassuranceIntervalId;
        const reassuranceMessage = "Still doing the task, do not panic. This may take a while...";
        const abortController = new AbortController(); // For closing connections

        function fetchLogs() {
            fetch(`get-logs?session_id=${requestData.session_id}`, { signal: abortController.signal })
                .then(response => response.json())
                .then(data => {
                    const logConsole = document.getElementById("log-console");

                    logConsole.innerHTML = "";

                    if (data.logs && data.logs.length > 0) {
                        data.logs.forEach((log, index) => {
                            if (log.trim() !== "") {
                                const logLine = document.createElement("div");
                                logLine.innerText = `[${index + 1}] ${log}`;
                                logConsole.appendChild(logLine);
                            }
                        });
                    } else {
                        logConsole.innerText = "Waiting for updates...";
                    }

                    logConsole.scrollTop = logConsole.scrollHeight;

                    if (data.logs.some(log => log.includes("task executed successfully") || log.includes("task execution failed"))) {
                        clearInterval(intervalId);
                        clearInterval(reassuranceIntervalId);
                        abortController.abort(); 

                        document.getElementById("loading-icon").style.display = "none";

                        if (data.logs.some(log => log.includes("task executed successfully"))) {
                            document.getElementById("checkmark").style.display = "block";
                        } else if (data.logs.some(log => log.includes("task execution failed"))) {
                            document.getElementById("cross").style.display = "block";
                        }
                    } else {
                        if (pollingInterval === 1000) {
                            clearInterval(intervalId);
                            pollingInterval = 5000;
                            intervalId = setInterval(fetchLogs, pollingInterval);
                        }
                    }
                })
                .catch(error => {
                    if (error.name !== "AbortError") {
                        console.error("Error fetching logs:", error);
                    }
                });
        }

        function displayReassuranceMessage() {
            const logConsole = document.getElementById("log-console");
            const reassuranceLine = document.createElement("div");
            reassuranceLine.innerText = `[${logConsole.children.length + 1}] ${reassuranceMessage}`;
            logConsole.appendChild(reassuranceLine);

            logConsole.scrollTop = logConsole.scrollHeight;
        }

        fetchLogs();
        intervalId = setInterval(fetchLogs, pollingInterval);
        reassuranceIntervalId = setInterval(displayReassuranceMessage, 6000);
    </script>
</body>
